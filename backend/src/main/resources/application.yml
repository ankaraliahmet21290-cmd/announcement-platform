spring:
  profiles:
    active: dev
  application:
    name: emlak-platform-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwt:
    secret: "emlakPlatformSuperSecretKeyForJwtSigning32CharsOrLongerKey!"
    expiration-ms: 86400000 # 24 saat
  upload:
    dir: "uploads"

server:
  port: 8080

logging:
  level:
    root: INFO
    com.emlak: DEBUG
    org.springframework.security: INFO
